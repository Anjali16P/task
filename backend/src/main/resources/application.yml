server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: feedback-backend
  profiles:
    # Runs with an embedded H2 database out of the box (zero configuration).
    # Activate the "mysql" profile to use MySQL instead.
    default: dev
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: ${SHOW_SQL:false}
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Base64-encoded secret. MUST be provided in production via the JWT_SECRET env var.
    # The default below is for local development only.
    secret: ${JWT_SECRET:c0RlZmF1bHREZXZPbmx5U2VjcmV0S2V5Q2hhbmdlTWUxMjM0NTY3ODkwQWJDZEVmR2g=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  admin:
    # Initial administrator bootstrap. Only created when no admin exists.
    # If ADMIN_PASSWORD is not set, a random password is generated and logged once.
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    org.springframework.security: INFO
