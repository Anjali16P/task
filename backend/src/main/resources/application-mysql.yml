# Production-style profile using MySQL.
# Activate with:  --spring.profiles.active=mysql  (or SPRING_PROFILES_ACTIVE=mysql)
# Provide credentials via DB_URL / DB_USERNAME / DB_PASSWORD environment variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/feedback_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
